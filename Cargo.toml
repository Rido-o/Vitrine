[package]
name = "vitrine"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A GTK4 image viewer and wallpaper picker"
publish = false

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_20"] }
# For File::move_future (restoring from the trash); the same gio as gtk's.
gio = { version = "0.22", features = ["v2_72"] }
async-channel = "2"
libc = "0.2"
turbojpeg = { version = "1.5", default-features = false, features = ["pkg-config"] }
fast_image_resize = "6"
png = "0.18"
kamadak-exif = "0.6"

[profile.release]
debug = "line-tables-only"
